# Pushing a tag v<VERSION> builds, signs and packages both apps and publishes them as one GitHub Release
# (docs/发布与命名规则.md). Versions with a "-" (0.2.0-beta.2) are marked Pre-release. The notes are CHANGELOG.md's
# section for the version plus .github/release-footer.md.
#
# Signing is used when its secrets are there and skipped (with a warning) when not:
#   macOS    MACOS_CERT_P12_BASE64 + MACOS_CERT_PASSWORD                       Developer ID Application certificate
#            APPLE_API_KEY_P8_BASE64 + APPLE_API_KEY_ID + APPLE_API_ISSUER_ID   notarization (App Store Connect API key)
#   Windows  SIGNPATH_API_TOKEN secret + SIGNPATH_ORGANIZATION_ID / SIGNPATH_PROJECT_SLUG / SIGNPATH_POLICY_SLUG
#            variables                                                          SignPath (e.g. SignPath Foundation)
#            or WINDOWS_CERT_PFX_BASE64 + WINDOWS_CERT_PASSWORD                 a certificate exported as .pfx
# Repository variable RELEASE_DRAFT_ONLY=true leaves the release as a draft instead of publishing it.
# Re-running for a tag whose release is still a draft replaces its files; a published release is never touched.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and release again, e.g. v0.2.0-beta.2 (its release must not be published yet)"
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ inputs.tag || github.ref_name }}
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

jobs:
  prepare:
    name: Check version and notes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.info.outputs.version }}
      prerelease: ${{ steps.info.outputs.prerelease }}
      title: ${{ steps.info.outputs.title }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}

      - name: Tag matches VERSION
        id: info
        run: python3 .github/scripts/release.py info --tag "$TAG"

      - name: Release notes from CHANGELOG.md
        run: |
          python3 .github/scripts/release.py notes --out release-notes.md
          cat release-notes.md >> "$GITHUB_STEP_SUMMARY"

      - name: Not published already
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [ "$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null)" = "false" ]; then
            echo "::error::Release $TAG is already published; it is never overwritten. Bump VERSION and tag again."
            exit 1
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: notes
          path: release-notes.md

  windows:
    name: Windows x64
    needs: prepare
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
      POINT_TAKEN_BUILD_NUMBER: ${{ github.run_number }}
      VERSION: ${{ needs.prepare.outputs.version }}
      USE_SIGNPATH: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
      HAS_PFX: ${{ secrets.WINDOWS_CERT_PFX_BASE64 != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 8.0.x

      - name: NuGet cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ runner.os }}-${{ hashFiles('app/windows/**/*.csproj', 'app/windows/Directory.Build.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Install Inno Setup
        shell: powershell
        run: ./.github/scripts/install-inno-setup.ps1

      - name: Import code-signing certificate (.pfx)
        if: env.USE_SIGNPATH != 'true' && env.HAS_PFX == 'true'
        shell: powershell
        env:
          PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          PFX_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          $pfx = Join-Path $env:RUNNER_TEMP 'cert.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:PFX_BASE64))
          $password = ConvertTo-SecureString $env:PFX_PASSWORD -AsPlainText -Force
          $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $password |
            Where-Object { $_.HasPrivateKey } | Select-Object -First 1
          Remove-Item $pfx
          if (-not $cert) { throw 'WINDOWS_CERT_PFX_BASE64 holds no certificate with a private key' }
          Write-Host "signing as $($cert.Subject) (valid until $($cert.NotAfter))"
          [IO.File]::AppendAllText($env:GITHUB_ENV, "POINT_TAKEN_SIGN_CERT=$($cert.Thumbprint)`n")

      - name: Not signed
        if: env.USE_SIGNPATH != 'true' && env.HAS_PFX != 'true'
        run: echo "::warning title=Windows build not signed::No SignPath or .pfx secrets are set; SmartScreen will show 'unknown publisher'."

      - name: Test and publish
        shell: powershell
        run: ./app/windows/build.ps1 -Stage publish

      # SignPath signs between the stages: first the app's files, then the installer built from them
      - name: Upload app for signing
        if: env.USE_SIGNPATH == 'true'
        id: unsigned-app
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-app-unsigned
          path: dist/PointTaken-${{ env.VERSION }}-windows-x64/
          retention-days: 1

      - name: Sign app (SignPath)
        if: env.USE_SIGNPATH == 'true'
        uses: signpath/github-action-submit-signing-request@c92b958760219087e01f8d67a1669ed57afe2627 # v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG }}
          artifact-configuration-slug: windows-app
          github-artifact-id: ${{ steps.unsigned-app.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: dist/signed-app

      - name: Use the signed app
        if: env.USE_SIGNPATH == 'true'
        shell: powershell
        run: |
          Copy-Item dist\signed-app\* "dist\PointTaken-$env:VERSION-windows-x64" -Recurse -Force
          Remove-Item -Recurse -Force dist\signed-app

      - name: Zip and installer
        shell: powershell
        run: ./app/windows/build.ps1 -Stage package

      - name: Upload installer for signing
        if: env.USE_SIGNPATH == 'true'
        id: unsigned-setup
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-setup-unsigned
          path: dist/PointTaken-${{ env.VERSION }}-windows-x64-setup.exe
          retention-days: 1

      - name: Sign installer (SignPath)
        if: env.USE_SIGNPATH == 'true'
        uses: signpath/github-action-submit-signing-request@c92b958760219087e01f8d67a1669ed57afe2627 # v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG }}
          artifact-configuration-slug: windows-installer
          github-artifact-id: ${{ steps.unsigned-setup.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: dist/signed-setup

      - name: Use the signed installer
        if: env.USE_SIGNPATH == 'true'
        shell: powershell
        run: |
          Move-Item -Force "dist\signed-setup\PointTaken-$env:VERSION-windows-x64-setup.exe" dist
          Remove-Item -Recurse -Force dist\signed-setup

      - name: Checksums
        shell: powershell
        run: ./app/windows/build.ps1 -Stage checksum

      - name: Check signatures
        if: env.USE_SIGNPATH == 'true' || env.HAS_PFX == 'true'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $files = @("dist\PointTaken-$env:VERSION-windows-x64\PointTaken.exe", "dist\PointTaken-$env:VERSION-windows-x64-setup.exe")
          foreach ($f in $files) {
            $s = Get-AuthenticodeSignature $f
            Write-Host "$(Split-Path $f -Leaf): $($s.Status) | $($s.SignerCertificate.Subject)"
            if ($s.Status -ne 'Valid') { throw "$f is not validly signed: $($s.StatusMessage)" }
          }

      - name: Remove certificate
        if: always() && env.POINT_TAKEN_SIGN_CERT != ''
        shell: powershell
        run: Remove-Item "Cert:\CurrentUser\My\$env:POINT_TAKEN_SIGN_CERT" -DeleteKey -ErrorAction SilentlyContinue

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-windows
          path: |
            dist/*.zip
            dist/*.exe
            dist/*.sha256
          if-no-files-found: error

  macos:
    name: macOS arm64
    needs: prepare
    runs-on: xcode-27 # same toolchain as CI (ci.yml)
    timeout-minutes: 90
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
      HAS_MAC_CERT: ${{ secrets.MACOS_CERT_P12_BASE64 != '' }}
      HAS_NOTARY_KEY: ${{ secrets.APPLE_API_KEY_P8_BASE64 != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0 # the build number (CFBundleVersion) is the commit count

      - name: Toolchain
        run: |
          sw_vers
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-version

      - name: Import Developer ID certificate
        if: env.HAS_MAC_CERT == 'true'
        env:
          P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          KC="$RUNNER_TEMP/signing.keychain-db"
          KC_PASS="$(uuidgen)"
          security create-keychain -p "$KC_PASS" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KC_PASS" "$KC"
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$P12_PASSWORD" -f pkcs12 -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KC_PASS" "$KC" > /dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          ID="$(security find-identity -v -p codesigning "$KC" | awk -F'"' '/Developer ID Application/ {print $2; exit}')"
          if [ -z "$ID" ]; then
            echo "::error::MACOS_CERT_P12_BASE64 holds no 'Developer ID Application' identity"
            exit 1
          fi
          echo "signing as: $ID"
          echo "POINT_TAKEN_SIGN_IDENTITY=$ID" >> "$GITHUB_ENV"
          echo "POINT_TAKEN_KEYCHAIN=$KC" >> "$GITHUB_ENV"

      - name: Notarization key
        if: env.HAS_MAC_CERT == 'true' && env.HAS_NOTARY_KEY == 'true'
        env:
          P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
        run: |
          echo "$P8_BASE64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"

      - name: Not signed
        if: env.HAS_MAC_CERT != 'true'
        run: echo "::warning title=macOS build not notarized::No Developer ID secrets are set; the app is ad-hoc signed and Gatekeeper asks users to allow it."

      - name: Not notarized
        if: env.HAS_MAC_CERT == 'true' && env.HAS_NOTARY_KEY != 'true'
        run: echo "::warning title=macOS build not notarized::Signed with Developer ID, but no APPLE_API_KEY_* secrets are set for notarization."

      - name: Test
        run: swift test --package-path app/macos

      - name: Build, sign, notarize
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: app/macos/build-dmg.sh

      - name: Check signature
        run: |
          VERSION="$(cat VERSION)"
          hdiutil attach -nobrowse -readonly -mountpoint "$RUNNER_TEMP/dmg" "dist/PointTaken-$VERSION-macos-arm64.dmg"
          codesign -dv --verbose=2 "$RUNNER_TEMP/dmg/Point Taken.app" 2>&1 | grep -E "Identifier|Authority|Signature|Runtime|flags" || true
          /usr/libexec/PlistBuddy -c 'Print PointTakenVersion' "$RUNNER_TEMP/dmg/Point Taken.app/Contents/Info.plist"
          if [ "$HAS_MAC_CERT" = "true" ] && [ "$HAS_NOTARY_KEY" = "true" ]; then
            spctl --assess --type execute --verbose=2 "$RUNNER_TEMP/dmg/Point Taken.app"
          fi
          hdiutil detach "$RUNNER_TEMP/dmg"

      - name: Clean up keychain and keys
        if: always()
        run: |
          [ -n "${POINT_TAKEN_KEYCHAIN:-}" ] && security delete-keychain "$POINT_TAKEN_KEYCHAIN" || true
          rm -f "$RUNNER_TEMP/AuthKey.p8"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-macos
          path: |
            dist/*.dmg
            dist/*.sha256
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [prepare, windows, macos]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write # create the release
      id-token: write # sign the provenance attestation
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.prepare.outputs.version }}
      TITLE: ${{ needs.prepare.outputs.title }}
      PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: notes
          path: notes

      - name: Check names and checksums
        run: |
          ls -la dist
          python3 .github/scripts/release.py verify dist --version "$VERSION"

      - name: Build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe

      - name: Upload to a draft release
        run: |
          set -euo pipefail
          FLAGS=""
          [ "$PRERELEASE" = "true" ] && FLAGS="--prerelease"
          STATE="$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null || echo none)"
          case "$STATE" in
            false) echo "::error::Release $TAG is already published; it is never overwritten."; exit 1 ;;
            true)  gh release upload "$TAG" dist/* --clobber
                   gh release edit "$TAG" --title "$TITLE" --notes-file notes/release-notes.md $FLAGS ;;
            *)     gh release create "$TAG" dist/* --draft --verify-tag --title "$TITLE" \
                     --notes-file notes/release-notes.md $FLAGS ;;
          esac

      - name: Publish
        if: vars.RELEASE_DRAFT_ONLY != 'true'
        run: gh release edit "$TAG" --draft=false

      - name: Summary
        env:
          DRAFT_ONLY: ${{ vars.RELEASE_DRAFT_ONLY }}
        run: |
          URL="$(gh release view "$TAG" --json url --jq .url)"
          {
            echo "### $TITLE"
            echo
            if [ "$DRAFT_ONLY" = "true" ]; then echo "Left as a **draft** (RELEASE_DRAFT_ONLY=true)."; fi
            echo "$URL"
            echo
            echo '```'
            (cd dist && cat *.sha256)
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
